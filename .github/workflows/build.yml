# Builds the hMailServer installer on a GitHub-hosted VS2022 runner.
#
# The steps mirror the TeamCity job this replaces: build the developer tools, stamp the
# version with ConfigureInstallation.exe, build the server, build the administration tools,
# and compile hMailServer64.iss with Inno Setup into a setup executable.
#
# The installer is then handed to tests.yml, which installs it on a runner of its own and
# runs the regression tests against it, before the publish job releases it under its
# version-stamped name. A failing suite therefore stops the release.
#
# The expensive part of a hMailServer build is not the server itself (a few minutes) but the
# four third-party libraries it links against - OpenSSL, Boost, libpq and libmariadb - which
# take 35-45 minutes to build from source. Each is therefore cached separately under
# %hMailServerLibs%, keyed on the version the repository pins plus the script that builds it,
# so a normal run restores them and only compiles hMailServer.
#
# About the runner: windows-2022 ships Visual Studio 2022 (no VS2019 at all) with the v142
# compiler that hMailServer's projects are pinned to, but without ATL for v142 - which the
# ATL-static projects need. The workflow installs that one component when it is missing
# (~4 minutes). windows-2025 is not an alternative: it now ships Visual Studio 18.
name: Build

on:
  push:
    branches:
      - master
      - 'claude/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Product version, major.minor.patch. Defaults to the VERSION file.'
        required: false
        default: ''
      build:
        description: 'Build number. Defaults to the run number of this workflow.'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the library build scripts download and build into. Anywhere outside the working
  # directory will do; the build scripts and hMailServer.vcxproj both read this variable.
  hMailServerLibs: C:\hMailLibs
  # "C++ v14.29 (16.11) ATL for v142 build tools (x86 & x64)" in the VS2022 installer.
  ATL_COMPONENT: Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL

jobs:
  build:
    name: Release x64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.product.outputs.version }}
      build: ${{ steps.product.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the library folder
        run: New-Item -ItemType Directory -Force -Path $env:hMailServerLibs | Out-Null

      - name: Install ATL for the v142 toolset if the image lacks it
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instance = (& $vswhere -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | Out-String | ConvertFrom-Json) | Select-Object -First 1
          if (-not $instance) { throw "No Visual Studio 2022 with the x64 C++ toolchain was found." }

          # hMailServer.vcxproj is PlatformToolset v142 with UseOfAtl=Static, so the 14.29
          # toolset needs its atlmfc folder. The image ships the v142 compiler but only the
          # v143 ATL, so compiling fails with C1083 on atlbase.h unless we add the component.
          $toolset = Get-ChildItem (Join-Path $instance.installationPath 'VC\Tools\MSVC') -Directory -Filter '14.29.*' | Select-Object -First 1
          if (-not $toolset) { throw "The v142 (14.29) toolset is not installed in $($instance.installationPath)." }

          $hasAtl = (Test-Path (Join-Path $toolset.FullName 'atlmfc\include\atlbase.h')) -and
                    (Test-Path (Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib'))
          if ($hasAtl) {
              "ATL for v142 is already installed in $($toolset.Name) - nothing to do."
              exit 0
          }

          "ATL for v142 is missing from $($toolset.Name); installing $env:ATL_COMPONENT"
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          # & with splatting, not Start-Process -ArgumentList: the install path contains a
          # space, and -ArgumentList would hand the installer "--installPath C:\Program".
          $installerArgs = @(
              'modify',
              '--installPath', $instance.installationPath,
              '--productId', $instance.productId,
              '--channelId', $instance.channelId,
              '--add', $env:ATL_COMPONENT,
              '--quiet', '--norestart'
          )
          & $installer @installerArgs
          "vs_installer exit code: $LASTEXITCODE"

          # vs_installer.exe delegates to background setup processes and returns before they
          # finish, so wait for them to drain before checking the result.
          $deadline = (Get-Date).AddMinutes(30)
          while ((Get-Date) -lt $deadline) {
              $running = Get-Process -Name 'vs_installer', 'vs_installershell', 'vs_installerservice', 'setup' -ErrorAction SilentlyContinue
              if (-not $running) { break }
              Start-Sleep -Seconds 10
          }
          $stopwatch.Stop()
          "Installed in {0:F1} minutes" -f $stopwatch.Elapsed.TotalMinutes

          $hasAtl = (Test-Path (Join-Path $toolset.FullName 'atlmfc\include\atlbase.h')) -and
                    (Test-Path (Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib'))
          if (-not $hasAtl) { throw "Installing $env:ATL_COMPONENT did not produce atlmfc under $($toolset.FullName)." }

      - name: Read the pinned library versions
        id: versions
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\Get-LibraryVersions.ps1

      - name: Determine the version and build number
        id: product
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          # TeamCity kept these in build parameters; here the version lives in the VERSION
          # file and the build number is the run number, both overridable on a manual run.
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { (Get-Content VERSION -Raw).Trim() }
          $build = if ($env:INPUT_BUILD) { $env:INPUT_BUILD.Trim() } else { $env:GITHUB_RUN_NUMBER }

          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "The version must be major.minor.patch, was '$version'." }
          if ($build -notmatch '^\d+$') { throw "The build number must be numeric, was '$build'." }

          "Building hMailServer $version-B$build"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "build=$build"

      - name: Pick the .NET Framework the C# projects build against
        id: netfx
        run: |
          # The C# projects target .NET Framework 4.5, whose reference assemblies Visual
          # Studio 2022 no longer installs. 4.5 through 4.8 are in-place updates of the same
          # runtime, so building against a later targeting pack is safe; the override is used
          # only when v4.5 really is missing, and never below v4.7.2 - the highest version any
          # project in the two solutions asks for, which must not be downgraded.
          $refRoot = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework"
          $installed = @(Get-ChildItem $refRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'mscorlib.dll') } |
              ForEach-Object { $_.Name })
          "Installed targeting packs: $($installed -join ', ')"

          $override = ''
          if ($installed -notcontains 'v4.5') {
              $candidate = $installed |
                  Where-Object { $_ -match '^v(\d+(\.\d+)+)$' -and [version]$Matches[1] -ge [version]'4.7.2' } |
                  Sort-Object { [version]($_ -replace '^v', '') } |
                  Select-Object -First 1
              if (-not $candidate) { throw "No .NET Framework targeting pack of v4.7.2 or later is installed." }
              $override = $candidate
              "v4.5 is not installed; building the C# projects against $override instead."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "override=$override"

      # One cache per library, so bumping one version does not throw the others away. Each key
      # carries the pinned version, the scripts that produce the build, and the runner image;
      # libpq and libmariadb link against OpenSSL, so their keys carry its version too, and
      # Boost's carries the toolset its libraries are name-tagged with.
      #
      # Deliberately no restore-keys: a partial match would restore a tree built from a
      # different version or toolset, which is worse than rebuilding.
      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: C:\hMailLibs\${{ steps.versions.outputs.openssl_dir }}
          key: openssl-${{ steps.versions.outputs.openssl }}-windows-2022-${{ hashFiles('libraries/build-openssl.ps1', 'libraries/build-common.ps1') }}

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: C:\hMailLibs\${{ steps.versions.outputs.boost_dir }}
          key: boost-${{ steps.versions.outputs.boost }}-msvc14.2-windows-2022-${{ hashFiles('libraries/build-boost.ps1', 'libraries/build-common.ps1') }}

      - name: Cache PostgreSQL (libpq)
        id: cache-pgsql
        uses: actions/cache@v4
        with:
          path: C:\hMailLibs\${{ steps.versions.outputs.postgresql_dir }}
          key: pgsql-${{ steps.versions.outputs.postgresql }}-ssl${{ steps.versions.outputs.openssl }}-windows-2022-${{ hashFiles('libraries/build-pgsql.ps1', 'libraries/build-common.ps1') }}

      - name: Cache MariaDB Connector/C
        id: cache-mariadb
        uses: actions/cache@v4
        with:
          path: C:\hMailLibs\${{ steps.versions.outputs.mariadb_dir }}
          key: mariadb-${{ steps.versions.outputs.mariadb }}-ssl${{ steps.versions.outputs.openssl }}-windows-2022-${{ hashFiles('libraries/build-mariadb.ps1', 'libraries/build-common.ps1') }}

      # Each build step prunes its tree before the job ends, because actions/cache saves the
      # whole path afterwards. What is kept is exactly what hMailServer.vcxproj and
      # post-build.bat reference; the rest is source and intermediates that would multiply the
      # cache size (Boost alone is ~2 GB unpruned against ~500 MB pruned).
      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\build-openssl.ps1 -Version ${{ steps.versions.outputs.openssl }}
          if ($LASTEXITCODE -ne 0) { throw "build-openssl.ps1 failed with exit code $LASTEXITCODE" }

          $root = Join-Path $env:hMailServerLibs '${{ steps.versions.outputs.openssl_dir }}'
          Get-ChildItem $root -Force | Where-Object { $_.Name -ne 'out64' } | Remove-Item -Recurse -Force
          foreach ($required in @('out64\include\openssl\ssl.h', 'out64\lib\libssl.lib', 'out64\bin\libssl-3-x64.dll')) {
              if (-not (Test-Path (Join-Path $root $required))) { throw "Pruning removed something needed: $required" }
          }

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\build-boost.ps1 -Version ${{ steps.versions.outputs.boost }}
          if ($LASTEXITCODE -ne 0) { throw "build-boost.ps1 failed with exit code $LASTEXITCODE" }

          # hMailServer.vcxproj references only the headers (boost_<ver>) and stage\lib.
          $root = Join-Path $env:hMailServerLibs '${{ steps.versions.outputs.boost_dir }}'
          Get-ChildItem $root -Force | Where-Object { $_.Name -notin @('boost', 'stage') } | Remove-Item -Recurse -Force
          if (-not (Test-Path (Join-Path $root 'boost\version.hpp'))) { throw "Pruning removed the Boost headers." }
          if (-not (Get-ChildItem (Join-Path $root 'stage\lib') -Filter '*vc142*.lib')) { throw "No vc142-tagged libraries in stage\lib - Boost was built with the wrong toolset." }

      - name: Build PostgreSQL (libpq)
        if: steps.cache-pgsql.outputs.cache-hit != 'true'
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\build-pgsql.ps1 -Version ${{ steps.versions.outputs.postgresql }}
          if ($LASTEXITCODE -ne 0) { throw "build-pgsql.ps1 failed with exit code $LASTEXITCODE" }

          # Keep the built libpq plus the headers the project includes (src\include and
          # src\interfaces\libpq); the rest of the PostgreSQL source tree is not referenced.
          $root = Join-Path $env:hMailServerLibs '${{ steps.versions.outputs.postgresql_dir }}'
          Get-ChildItem $root -Force | Where-Object { $_.Name -notin @('Release', 'src') } | Remove-Item -Recurse -Force
          Get-ChildItem (Join-Path $root 'src') -Force | Where-Object { $_.Name -notin @('include', 'interfaces') } | Remove-Item -Recurse -Force
          Get-ChildItem (Join-Path $root 'src\interfaces') -Force | Where-Object { $_.Name -ne 'libpq' } | Remove-Item -Recurse -Force
          foreach ($required in @('Release\libpq\libpq.dll', 'Release\libpq\libpq.lib', 'src\interfaces\libpq\libpq-fe.h')) {
              if (-not (Test-Path (Join-Path $root $required))) { throw "Pruning removed something needed: $required" }
          }

      - name: Build MariaDB Connector/C
        if: steps.cache-mariadb.outputs.cache-hit != 'true'
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\build-mariadb.ps1 -Version ${{ steps.versions.outputs.mariadb }}
          if ($LASTEXITCODE -ne 0) { throw "build-mariadb.ps1 failed with exit code $LASTEXITCODE" }

          # Only the DLL is shipped; hMailServer compiles against the vendored
          # libraries\libmysql-5.7.38 headers, not this source tree. Keep just the folder
          # chain leading to the DLL by dropping the siblings at each level.
          $root = Join-Path $env:hMailServerLibs '${{ steps.versions.outputs.mariadb_dir }}'
          Get-ChildItem $root -Force | Where-Object { $_.Name -ne 'build64' } | Remove-Item -Recurse -Force
          Get-ChildItem (Join-Path $root 'build64') -Force | Where-Object { $_.Name -ne 'libmariadb' } | Remove-Item -Recurse -Force
          Get-ChildItem (Join-Path $root 'build64\libmariadb') -Force | Where-Object { $_.Name -ne 'RelWithDebInfo' } | Remove-Item -Recurse -Force
          if (-not (Test-Path (Join-Path $root 'build64\libmariadb\RelWithDebInfo\libmariadb.dll'))) { throw "Pruning removed libmariadb.dll." }

      - name: Build the developer tools
        run: |
          # DevTools.sln builds ConfigureInstallation.exe, which the next step runs.
          . build\Find-MsBuild.ps1
          $msbuild = Find-MsBuild
          if (-not $msbuild) { throw "MSBuild was not found." }

          $arguments = @('hmailserver\tools\DevTools.sln', '/m', '/p:Configuration=Release', '/p:Platform=Any CPU')
          if ('${{ steps.netfx.outputs.override }}') { $arguments += '/p:TargetFrameworkVersion=${{ steps.netfx.outputs.override }}' }
          & $msbuild @arguments
          if ($LASTEXITCODE -ne 0) { throw "Building DevTools.sln failed with exit code $LASTEXITCODE" }

      - name: Stamp the version into the sources and the installer script
        run: |
          # Writes Version.h, the WebAdmin version check and the version and output file name
          # in section_setup_64.iss, so it has to run before the server is compiled.
          $configure = 'hmailserver\tools\ConfigureInstallation\bin\Release\ConfigureInstallation.exe'
          & $configure $env:GITHUB_WORKSPACE '${{ steps.product.outputs.version }}' '${{ steps.product.outputs.build }}'
          if ($LASTEXITCODE -ne 0) { throw "ConfigureInstallation.exe failed with exit code $LASTEXITCODE" }

      - name: Build hMailServer
        run: |
          # build.ps1 disables the pre/post build events, so the runner is spared the
          # 'NET STOP hMailServer' of a developer machine; the copy and registration half of
          # the post-build step runs separately below.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\build.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE" }

      - name: Copy the runtime DLLs and register the type library
        run: |
          # hMailAdmin has a COM reference to the hMailServer type library, so the tools
          # solution only compiles once hMailServer.exe has registered it - and the server
          # only starts for the registration with its DLLs beside it. post-build.ps1 does
          # both, exactly as the project's post-build event does on a developer machine.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\post-build.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "post-build.ps1 failed with exit code $LASTEXITCODE" }

      - name: Build the hMailServer tools
        run: |
          # hMailAdmin, DBSetup, DBUpdater and the rest of what the installer ships.
          . build\Find-MsBuild.ps1
          $msbuild = Find-MsBuild
          if (-not $msbuild) { throw "MSBuild was not found." }

          $arguments = @('hmailserver\source\Tools\hMailServer Tools.sln', '/m', '/p:Configuration=Release', '/p:Platform=x64')
          if ('${{ steps.netfx.outputs.override }}') { $arguments += '/p:TargetFrameworkVersion=${{ steps.netfx.outputs.override }}' }
          & $msbuild @arguments
          if ($LASTEXITCODE -ne 0) { throw "Building hMailServer Tools.sln failed with exit code $LASTEXITCODE" }

      - name: Collect the debug symbols
        run: |
          # Symbols for the binaries hMailServer itself ships, so a crash dump from a CI
          # build can be read. Third-party DLLs are left out - their symbols are not ours
          # to publish, and the installer already carries the DLLs.
          $symbolDirs = @(
              'hmailserver\source\Server\hMailServer\x64\Release',
              'hmailserver\source\Server\hMailServer.Minidump\x64\Release',
              'hmailserver\source\Tools\Administrator\bin\x64\Release',
              'hmailserver\source\Tools\DBSetup\Bin\x64\Release',
              'hmailserver\source\Tools\DBSetupQuick\bin\x64\Release',
              'hmailserver\source\Tools\DBUpdater\Bin\x64\Release',
              'hmailserver\source\Tools\DataDirectorySynchronizer\Bin\x64\Release',
              'hmailserver\source\Tools\Shared\bin\x64\Release'
          )

          $symbols = Join-Path $env:RUNNER_TEMP 'symbols'
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null

          foreach ($dir in $symbolDirs) {
              $pdbs = @(Get-ChildItem (Join-Path $dir '*.pdb') -ErrorAction SilentlyContinue)
              if ($pdbs) { Copy-Item $pdbs.FullName $symbols } else { "No symbols in $dir" }
          }

          # The server's own symbols are the ones that matter; missing those means the
          # Release build did not produce a PDB, which is worth failing over.
          if (-not (Test-Path (Join-Path $symbols 'hMailServer.pdb'))) { throw "hMailServer.pdb was not produced by this build." }

          Get-ChildItem $symbols | Select-Object Name, Length | Format-Table -AutoSize | Out-String

      - name: Upload the symbols for publishing
        uses: actions/upload-artifact@v4
        with:
          name: symbols-untested
          path: ${{ runner.temp }}/symbols
          if-no-files-found: error

      - name: Install Inno Setup
        run: |
          # hMailServer64.iss is an Inno Setup 5 script, and 5.6.1 is what the TeamCity build
          # compiled it with; the image carries Inno Setup 6 instead. --allow-downgrade is
          # what makes choco step back from it - the two versions install side by side, in
          # their own "Inno Setup 5" and "Inno Setup 6" folders.
          choco install innosetup --version=5.6.1 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc." }

          & $iscc "/DHMAILSERVERLIBS=$env:hMailServerLibs" hmailserver\installation\hMailServer64.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }

          # The script sets no OutputDir, so Inno Setup writes to Output next to it.
          $setup = Get-ChildItem 'hmailserver\installation\Output\*.exe' -ErrorAction SilentlyContinue
          if (-not $setup) { throw "ISCC.exe produced no setup executable." }
          $setup | Select-Object Name, Length | Format-Table -AutoSize | Out-String

      # Under a name that says it has not been tested yet. The regression tests run
      # against this artifact in the next job, and only if they pass does the publish job
      # re-upload it under the release name. An artifact is the only way to move a file
      # between jobs, so the run ends up carrying the installer twice - which is the price
      # of testing it on a machine that did not build it.
      - name: Upload the installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: installer-untested
          path: hmailserver/installation/Output/*.exe
          if-no-files-found: error

      - name: Upload the library build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: library-build-logs
          path: libraries/build-*.log
          if-no-files-found: ignore

  # A separate job, so the tests get a clean runner: nothing of the build is on it except
  # the installer, which is what a user would get. The publish job below waits for this,
  # so a failing suite stops the installer from being released.
  test:
    # The called workflow names the job that actually runs, and the web UI shows the two
    # together - so this one names the stage rather than repeating it.
    name: Tests
    needs: build
    uses: ./.github/workflows/tests.yml
    with:
      installer-artifact: installer-untested

  publish:
    name: Publish the installer
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download the tested installer
        uses: actions/download-artifact@v4
        with:
          name: installer-untested
          path: installer

      - name: Upload the installer under its release name
        uses: actions/upload-artifact@v4
        with:
          name: hMailServer-${{ needs.build.outputs.version }}-B${{ needs.build.outputs.build }}-x64-Setup
          path: installer/*.exe
          if-no-files-found: error

      - name: Download the symbols
        uses: actions/download-artifact@v4
        with:
          name: symbols-untested
          path: symbols

      - name: Upload the symbols under their release name
        uses: actions/upload-artifact@v4
        with:
          name: hMailServer-${{ needs.build.outputs.version }}-B${{ needs.build.outputs.build }}-x64-Symbols
          path: symbols/*.pdb
          if-no-files-found: error
