# Temporary diagnostic workflow.
#
# hMailServer's C++ projects are pinned to PlatformToolset v142 (Visual Studio 2019) and
# build ATL statically. The GitHub-hosted Windows images ship Visual Studio 2022 with the
# v142 *compiler* (Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64), but their
# published component list only mentions the v143 ATL components. This workflow answers,
# on a real runner:
#
#   1. Which Visual Studio versions/toolsets are installed (and confirms no VS2019 exists,
#      which the repo's build scripts currently require).
#   2. Whether ATL for v142 (14.29) is actually present - the decisive check.
#   3. Whether a minimal ATL translation unit compiles and links with the v142 toolset
#      selected out of VS2022 via "vcvars64.bat -vcvars_ver=14.29".
#   4. If ATL v142 is missing: whether adding it with vs_installer works, and what it costs
#      per run (it cannot be cached).
#   5. Whether the preinstalled Perl and CMake can drive the OpenSSL / libpq / libmariadb
#      builds, and whether CMake can target v142 through the VS2022 generator.
#
# Delete this file once the real build workflow is settled.
name: Toolchain probe (temporary)

on:
  push:
    branches:
      - claude/vs2022-github-actions-build-k1yd4b
  workflow_dispatch:

jobs:
  probe:
    name: Probe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Visual Studio installations
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          "=== All installations ==="
          & $vswhere -products '*' -property installationVersion
          & $vswhere -products '*' -property installationPath
          & $vswhere -products '*' -property catalog_productDisplayVersion

          ""
          "=== What the repo scripts ask for today: -version [16.0,17.0) (VS2019) ==="
          $vs2019 = & $vswhere -products '*' -version '[16.0,17.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($vs2019) { "FOUND: $vs2019" } else { "NOT FOUND - Resolve-VcVars64 / Find-MsBuild would fail here." }

          ""
          "=== VS2022: -version [17.0,18.0) ==="
          $vs2022 = (& $vswhere -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          "FOUND: $vs2022"
          if (-not $vs2022) { throw "No VS2022 with the x64 C++ toolchain found." }

          Add-Content -Path $env:GITHUB_ENV -Value "VSPATH=$vs2022"

      - name: MSVC toolsets and ATL availability
        run: |
          $vs = $env:VSPATH
          "Visual Studio: $vs"
          ""

          $toolsRoot = Join-Path $vs 'VC\Tools\MSVC'
          "=== Installed MSVC toolsets, and whether each ships ATL ==="
          $has142Atl = $false
          foreach ($toolset in (Get-ChildItem $toolsRoot -Directory | Sort-Object Name)) {
              $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
              $lib    = Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib'
              $hasHeader = Test-Path $header
              $hasLib = Test-Path $lib
              "{0,-16}  atlbase.h={1,-5}  x64\atls.lib={2}" -f $toolset.Name, $hasHeader, $hasLib
              if ($toolset.Name -like '14.29.*' -and $hasHeader -and $hasLib) { $has142Atl = $true }
          }

          ""
          "=== Verdict for the v142 (14.29) toolset ==="
          if ($has142Atl) {
              "ATL for v142 IS present - hMailServer.vcxproj (v142 + UseOfAtl=Static) can build as-is."
          } else {
              "ATL for v142 is MISSING - the build workflow would need vs_installer to add"
              "Microsoft.VisualStudio.Component.VC.v142.ATL, or the projects must move to v143."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ATL142=$has142Atl"

      - name: Compile a minimal static-ATL translation unit with v142
        continue-on-error: true
        run: |
          # Mirrors how hMailServer uses ATL: static ATL, COM smart pointers, MBCS.
          $probeDir = Join-Path $env:RUNNER_TEMP 'atlprobe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $source = @(
              '#include <atlbase.h>',
              '#include <atlcom.h>',
              '',
              'int main()',
              '{',
              '    ::CoInitialize(nullptr);',
              '    CComPtr<IUnknown> unknown;',
              '    CComBSTR text(L"probe");',
              '    ::CoUninitialize();',
              '    return unknown ? 1 : 0;',
              '}'
          )
          Set-Content -Path (Join-Path $probeDir 'probe.cpp') -Value $source -Encoding ascii

          $vcvars = Join-Path $env:VSPATH 'VC\Auxiliary\Build\vcvars64.bat'
          "Using $vcvars -vcvars_ver=14.29"
          ""

          Push-Location $probeDir
          cmd /c "call `"$vcvars`" -vcvars_ver=14.29 && echo VCToolsVersion=%VCToolsVersion% && cl /nologo /EHsc /MD /D_MBCS probe.cpp atls.lib ole32.lib oleaut32.lib"
          $code = $LASTEXITCODE
          Pop-Location

          ""
          if ($code -eq 0) { "RESULT: static ATL compiles and links with the v142 toolset." }
          else { "RESULT: FAILED with exit code $code." }
          exit $code

      - name: Add the v142 ATL component (only if it was missing)
        if: env.ATL142 != 'True'
        continue-on-error: true
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) { throw "vs_installer.exe not found at $installer" }

          $installerArgs = @(
              'modify',
              '--installPath', $env:VSPATH,
              '--add', 'Microsoft.VisualStudio.Component.VC.v142.ATL',
              '--quiet', '--norestart', '--nocache', '--wait'
          )
          "Running: vs_installer.exe $($installerArgs -join ' ')"
          $process = Start-Process -FilePath $installer -ArgumentList $installerArgs -Wait -PassThru -NoNewWindow
          $stopwatch.Stop()
          "vs_installer exit code: $($process.ExitCode)"
          "Elapsed: {0:F1} minutes" -f $stopwatch.Elapsed.TotalMinutes

      - name: Re-check ATL and re-compile after the installer step
        if: env.ATL142 != 'True'
        continue-on-error: true
        run: |
          $toolsRoot = Join-Path $env:VSPATH 'VC\Tools\MSVC'
          foreach ($toolset in (Get-ChildItem $toolsRoot -Directory | Sort-Object Name)) {
              $hasHeader = Test-Path (Join-Path $toolset.FullName 'atlmfc\include\atlbase.h')
              $hasLib = Test-Path (Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib')
              "{0,-16}  atlbase.h={1,-5}  x64\atls.lib={2}" -f $toolset.Name, $hasHeader, $hasLib
          }

          $probeDir = Join-Path $env:RUNNER_TEMP 'atlprobe'
          $vcvars = Join-Path $env:VSPATH 'VC\Auxiliary\Build\vcvars64.bat'
          Push-Location $probeDir
          cmd /c "call `"$vcvars`" -vcvars_ver=14.29 && echo VCToolsVersion=%VCToolsVersion% && cl /nologo /EHsc /MD /D_MBCS probe.cpp atls.lib ole32.lib oleaut32.lib"
          $code = $LASTEXITCODE
          Pop-Location
          "Compile exit code after installing the component: $code"

      - name: MSBuild, Perl, CMake and Windows SDKs
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          "=== MSBuild (build/Find-MsBuild.ps1 currently restricts this to [16.0,17.0)) ==="
          $msbuild = & $vswhere -products '*' -version '[17.0,18.0)' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          "Found: $msbuild"
          if ($msbuild) { & $msbuild -version -nologo }

          ""
          "=== Perl (needed by OpenSSL Configure and PostgreSQL build.pl) ==="
          $perls = Get-Command perl -All -ErrorAction SilentlyContinue
          if ($perls) {
              $perls | ForEach-Object { $_.Source }
              perl -e 'print "flavour: $^O, version: $], exe: $^X\n"'
          } else {
              "No perl on PATH."
          }

          ""
          "=== CMake (needed by libmariadb) ==="
          $cmake = Get-Command cmake -ErrorAction SilentlyContinue
          if ($cmake) { $cmake.Source; cmake --version } else { "No cmake on PATH." }

          ""
          "=== Windows SDKs (WindowsTargetPlatformVersion is 10.0 -> latest installed) ==="
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          if (Test-Path $sdkRoot) { Get-ChildItem $sdkRoot -Directory | Select-Object -ExpandProperty Name }

      - name: CMake configure with the VS2022 generator targeting v142
        continue-on-error: true
        run: |
          # build-mariadb.ps1 hardcodes -G "Visual Studio 16 2019". On a VS2022-only runner it
          # must become -G "Visual Studio 17 2022" -T v142; this proves that combination works.
          $dir = Join-Path $env:RUNNER_TEMP 'cmakeprobe'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $cmakeLists = @(
              'cmake_minimum_required(VERSION 3.10)',
              'project(probe C)',
              'add_library(probe STATIC probe.c)'
          )
          Set-Content -Path (Join-Path $dir 'CMakeLists.txt') -Value $cmakeLists -Encoding ascii
          Set-Content -Path (Join-Path $dir 'probe.c') -Value 'int probe(void) { return 0; }' -Encoding ascii

          cmake -S $dir -B (Join-Path $dir 'build') -G 'Visual Studio 17 2022' -A x64 -T v142
          $configure = $LASTEXITCODE
          if ($configure -eq 0) { cmake --build (Join-Path $dir 'build') --config RelWithDebInfo }
          "cmake configure exit code: $configure, build exit code: $LASTEXITCODE"
