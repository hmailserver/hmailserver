# Temporary diagnostic workflow.
#
# Established so far on windows-2022 (VS2022 Enterprise 17.14, the only VS installed):
#
#   - No VS2019: vswhere -version [16.0,17.0) finds nothing.
#   - The v142 compiler is present (14.29.30133) and vcvars64 -vcvars_ver=14.29 selects it
#     (VCToolsVersion=14.29.30133), but atlmfc is installed only for 14.44 (v143), so
#     hMailServer.vcxproj (v142 + UseOfAtl=Static) fails with C1083 on atlbase.h.
#   - Strawberry Perl 5.32.1 and CMake 3.31.6 are present; cmake -G "Visual Studio 17 2022"
#     -A x64 -T v142 configures and builds, so the third-party libraries are fine.
#   - Adding Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL failed twice, silently:
#     vs_installer.exe returned in ~5s without installing anything, and the aka.ms
#     bootstrapper exited with code 1 after unpacking itself. Neither printed a reason.
#
# This round finds out WHY, and tries the two remaining shapes of the install:
#
#   A. vs_installer.exe modify, with --productId/--channelId spelled out.
#   B. the aka.ms bootstrapper, likewise, with --installWhileDownloading.
#   C. an offline layout of just that one component, then install from the layout. If this
#      works it is also the cacheable option: the layout can be restored from the Actions
#      cache and installed in seconds on later runs.
#
# Every attempt is timed, and the VS setup logs (%TEMP%\dd_*.log) are printed afterwards -
# that is where the real error text lives.
#
# Delete this file once the real build workflow is settled.
name: Toolchain probe (temporary)

on:
  push:
    branches:
      - claude/vs2022-github-actions-build-k1yd4b
  workflow_dispatch:

env:
  # "C++ v14.29 (16.11) ATL for v142 build tools (x86 & x64)" as named by the VS2022 installer.
  ATL_COMPONENT: Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL
  CHANNEL_ID: VisualStudio.17.Release

jobs:
  probe:
    name: Install v142 ATL on windows-2022
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Locate Visual Studio
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instance = (& $vswhere -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | Out-String | ConvertFrom-Json) | Select-Object -First 1
          if (-not $instance) { throw "No VS2022 with the x64 C++ toolchain found." }

          "Visual Studio $($instance.installationVersion) at $($instance.installationPath)"
          "Product:   $($instance.productId)"
          "Channel:   $($instance.channelId)"
          "Elevated:  $([Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"

          Add-Content -Path $env:GITHUB_ENV -Value "VSPATH=$($instance.installationPath)"
          Add-Content -Path $env:GITHUB_ENV -Value "VSPRODUCT=$($instance.productId)"
          # The instance's own channel is authoritative; the env default is only a fallback.
          if ($instance.channelId) {
              Add-Content -Path $env:GITHUB_ENV -Value "CHANNEL_ID=$($instance.channelId)"
          }

      - name: Attempt A - vs_installer.exe modify with productId/channelId
        continue-on-error: true
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installerArgs = @(
              'modify',
              '--installPath', $env:VSPATH,
              '--productId', $env:VSPRODUCT,
              '--channelId', $env:CHANNEL_ID,
              '--add', $env:ATL_COMPONENT,
              '--quiet', '--norestart'
          )
          "Running: vs_installer.exe $($installerArgs -join ' ')"
          $process = Start-Process -FilePath $installer -ArgumentList $installerArgs -Wait -PassThru -NoNewWindow
          "vs_installer exit code: $($process.ExitCode)"

          # vs_installer.exe delegates to background setup processes and can return before
          # they finish; wait for them to drain before judging the result.
          $deadline = (Get-Date).AddMinutes(30)
          while ((Get-Date) -lt $deadline) {
              $running = Get-Process -Name 'vs_installer', 'vs_installershell', 'vs_installerservice', 'setup', 'vs_setup_bootstrapper' -ErrorAction SilentlyContinue
              if (-not $running) { break }
              Start-Sleep -Seconds 10
          }
          $stopwatch.Stop()
          "Elapsed including wait: {0:F1} minutes" -f $stopwatch.Elapsed.TotalMinutes

      - name: Check ATL after attempt A
        id: check_a
        run: |
          $toolset = Get-ChildItem (Join-Path $env:VSPATH 'VC\Tools\MSVC') -Directory -Filter '14.29.*' | Select-Object -First 1
          $ok = $false
          if ($toolset) {
              $ok = (Test-Path (Join-Path $toolset.FullName 'atlmfc\include\atlbase.h')) -and (Test-Path (Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib'))
          }
          "v142 ATL installed after attempt A: $ok"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "installed=$ok"

      - name: Attempt B - bootstrapper with productId/channelId
        if: steps.check_a.outputs.installed != 'True'
        continue-on-error: true
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $url = switch -Wildcard ($env:VSPRODUCT) {
              '*Enterprise'   { 'https://aka.ms/vs/17/release/vs_enterprise.exe'; break }
              '*Professional' { 'https://aka.ms/vs/17/release/vs_professional.exe'; break }
              default         { 'https://aka.ms/vs/17/release/vs_community.exe' }
          }
          $exe = Join-Path $env:RUNNER_TEMP 'vs_bootstrapper.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          "Downloaded $url ({0:N1} MB)" -f ((Get-Item $exe).Length / 1MB)

          $bootstrapperArgs = @(
              'modify',
              '--installPath', $env:VSPATH,
              '--productId', $env:VSPRODUCT,
              '--channelId', $env:CHANNEL_ID,
              '--add', $env:ATL_COMPONENT,
              '--quiet', '--norestart', '--wait', '--installWhileDownloading'
          )
          "Running: vs_bootstrapper.exe $($bootstrapperArgs -join ' ')"
          $process = Start-Process -FilePath $exe -ArgumentList $bootstrapperArgs -Wait -PassThru -NoNewWindow
          $stopwatch.Stop()
          "bootstrapper exit code: $($process.ExitCode)  (0=ok, 3010=ok+reboot pending, 1602=cancelled)"
          "Elapsed: {0:F1} minutes" -f $stopwatch.Elapsed.TotalMinutes

      - name: Check ATL after attempt B
        id: check_b
        if: steps.check_a.outputs.installed != 'True'
        run: |
          $toolset = Get-ChildItem (Join-Path $env:VSPATH 'VC\Tools\MSVC') -Directory -Filter '14.29.*' | Select-Object -First 1
          $ok = $false
          if ($toolset) {
              $ok = (Test-Path (Join-Path $toolset.FullName 'atlmfc\include\atlbase.h')) -and (Test-Path (Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib'))
          }
          "v142 ATL installed after attempt B: $ok"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "installed=$ok"

      - name: Attempt C - offline layout of just the ATL component, then install from it
        if: steps.check_a.outputs.installed != 'True' && steps.check_b.outputs.installed != 'True'
        continue-on-error: true
        run: |
          # A layout is a local copy of just the requested packages. If this works it is the
          # cacheable path: download the layout once, restore it from the Actions cache on
          # later runs, and install from it in seconds.
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $layout = 'C:\vslayout'
          $exe = Join-Path $env:RUNNER_TEMP 'vs_bootstrapper.exe'
          if (-not (Test-Path $exe)) {
              Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_enterprise.exe' -OutFile $exe
          }

          $layoutArgs = @('--layout', $layout, '--add', $env:ATL_COMPONENT, '--lang', 'en-US', '--quiet', '--wait')
          "Running: vs_bootstrapper.exe $($layoutArgs -join ' ')"
          $process = Start-Process -FilePath $exe -ArgumentList $layoutArgs -Wait -PassThru -NoNewWindow
          "layout exit code: $($process.ExitCode)"
          "Layout download took {0:F1} minutes" -f $stopwatch.Elapsed.TotalMinutes

          if (Test-Path $layout) {
              $size = (Get-ChildItem $layout -Recurse -File | Measure-Object -Property Length -Sum).Sum
              "Layout size: {0:N0} MB" -f ($size / 1MB)
              Get-ChildItem $layout -Filter '*.exe' | ForEach-Object { "  $($_.Name)" }

              $setup = Join-Path $layout 'vs_setup.exe'
              if (-not (Test-Path $setup)) { $setup = (Get-ChildItem $layout -Filter 'vs_*.exe' | Select-Object -First 1).FullName }
              $installArgs = @(
                  'modify',
                  '--installPath', $env:VSPATH,
                  '--productId', $env:VSPRODUCT,
                  '--channelId', $env:CHANNEL_ID,
                  '--add', $env:ATL_COMPONENT,
                  '--quiet', '--norestart', '--wait', '--noWeb'
              )
              "Running: $setup $($installArgs -join ' ')"
              $install = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru -NoNewWindow
              "install-from-layout exit code: $($install.ExitCode)"
          }
          $stopwatch.Stop()
          "Elapsed total: {0:F1} minutes" -f $stopwatch.Elapsed.TotalMinutes

      - name: Final ATL state and compile
        continue-on-error: true
        run: |
          foreach ($toolset in (Get-ChildItem (Join-Path $env:VSPATH 'VC\Tools\MSVC') -Directory | Sort-Object Name)) {
              $hasHeader = Test-Path (Join-Path $toolset.FullName 'atlmfc\include\atlbase.h')
              $hasLib = Test-Path (Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib')
              "{0,-16}  atlbase.h={1,-5}  x64\atls.lib={2}" -f $toolset.Name, $hasHeader, $hasLib
          }

          $probeDir = Join-Path $env:RUNNER_TEMP 'atlprobe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $source = @(
              '#include <atlbase.h>',
              '#include <atlcom.h>',
              '',
              'int main()',
              '{',
              '    ::CoInitialize(nullptr);',
              '    CComPtr<IUnknown> unknown;',
              '    CComBSTR text(L"probe");',
              '    ::CoUninitialize();',
              '    return unknown ? 1 : 0;',
              '}'
          )
          Set-Content -Path (Join-Path $probeDir 'probe.cpp') -Value $source -Encoding ascii

          $vcvars = Join-Path $env:VSPATH 'VC\Auxiliary\Build\vcvars64.bat'
          Push-Location $probeDir
          cmd /v:on /c "call `"$vcvars`" -vcvars_ver=14.29 && echo VCToolsVersion=!VCToolsVersion! && cl /nologo /EHsc /MD /D_MBCS probe.cpp atls.lib ole32.lib oleaut32.lib"
          $code = $LASTEXITCODE
          Pop-Location

          if ($code -eq 0) { "RESULT: static ATL compiles and links with the v142 toolset." }
          else { "RESULT: FAILED with exit code $code." }

      - name: Visual Studio setup logs
        if: always()
        continue-on-error: true
        run: |
          # The installer writes dd_*.log files to %TEMP%; they carry the actual error text
          # behind an exit code of 1. Print the tail of the most recent ones inline.
          $logs = Get-ChildItem -Path $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 8
          if (-not $logs) { "No dd_*.log files found in $env:TEMP"; return }

          foreach ($log in $logs) {
              ""
              "================ $($log.Name)  ({0:N0} KB, {1}) ================" -f ($log.Length / 1KB), $log.LastWriteTime
              Get-Content $log.FullName -Tail 60
          }
