# Temporary diagnostic workflow.
#
# Established so far on windows-2022 (VS2022 Enterprise 17.14, the only VS installed):
#
#   - No VS2019: vswhere -version [16.0,17.0) finds nothing.
#   - The v142 compiler is present (14.29.30133) and vcvars64 -vcvars_ver=14.29 selects it,
#     but atlmfc is installed only for 14.44 (v143), so hMailServer.vcxproj (v142 +
#     UseOfAtl=Static) fails with C1083 on atlbase.h.
#   - Strawberry Perl 5.32.1 and CMake 3.31.6 are present; cmake -G "Visual Studio 17 2022"
#     -A x64 -T v142 configures and builds, so the third-party libraries are covered.
#   - The three earlier attempts to add the ATL component failed for OUR reason, not the
#     installer's: Start-Process -ArgumentList joins array elements with spaces and does not
#     quote them, so the installer was handed "--installPath C:\Program" and logged
#     "An installed product matching the following parameters cannot be found: installPath:
#     C:\Program" in %TEMP%\dd_installer_*.log.
#
# This round invokes the installers through PowerShell's call operator with splatting, which
# quotes each argument properly, and reads $LASTEXITCODE. Everything else is unchanged: the
# component ID is the VS2022 one (Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL), both
# attempts are timed, and the installer's own logs are printed at the end.
#
# Delete this file once the real build workflow is settled.
name: Toolchain probe (temporary)

on:
  push:
    branches:
      - claude/vs2022-github-actions-build-k1yd4b
  workflow_dispatch:

env:
  # "C++ v14.29 (16.11) ATL for v142 build tools (x86 & x64)" as named by the VS2022 installer.
  ATL_COMPONENT: Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL
  CHANNEL_ID: VisualStudio.17.Release

jobs:
  probe:
    name: Install v142 ATL on windows-2022
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Locate Visual Studio
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instance = (& $vswhere -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | Out-String | ConvertFrom-Json) | Select-Object -First 1
          if (-not $instance) { throw "No VS2022 with the x64 C++ toolchain found." }

          "Visual Studio $($instance.installationVersion) at $($instance.installationPath)"
          "Product:  $($instance.productId)"
          "Channel:  $($instance.channelId)"
          "Elevated: $([Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"

          Add-Content -Path $env:GITHUB_ENV -Value "VSPATH=$($instance.installationPath)"
          Add-Content -Path $env:GITHUB_ENV -Value "VSPRODUCT=$($instance.productId)"
          if ($instance.channelId) {
              Add-Content -Path $env:GITHUB_ENV -Value "CHANNEL_ID=$($instance.channelId)"
          }

          ""
          "=== atlmfc per installed toolset (before) ==="
          foreach ($toolset in (Get-ChildItem (Join-Path $instance.installationPath 'VC\Tools\MSVC') -Directory | Sort-Object Name)) {
              $hasHeader = Test-Path (Join-Path $toolset.FullName 'atlmfc\include\atlbase.h')
              $hasLib = Test-Path (Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib')
              "{0,-16}  atlbase.h={1,-5}  x64\atls.lib={2}" -f $toolset.Name, $hasHeader, $hasLib
          }

      - name: Attempt A - vs_installer.exe modify
        continue-on-error: true
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          # & with splatting, NOT Start-Process -ArgumentList: the install path contains a
          # space, and -ArgumentList would pass it as several arguments (this is what made the
          # three earlier rounds fail with "installPath: C:\Program").
          $installerArgs = @(
              'modify',
              '--installPath', $env:VSPATH,
              '--productId', $env:VSPRODUCT,
              '--channelId', $env:CHANNEL_ID,
              '--add', $env:ATL_COMPONENT,
              '--quiet', '--norestart'
          )
          "Running: vs_installer.exe $($installerArgs -join ' ')"
          & $installer @installerArgs
          "vs_installer exit code: $LASTEXITCODE"

          # vs_installer.exe delegates to background setup processes and returns before they
          # finish, so wait for them to drain before judging the result.
          $deadline = (Get-Date).AddMinutes(30)
          while ((Get-Date) -lt $deadline) {
              $running = Get-Process -Name 'vs_installer', 'vs_installershell', 'vs_installerservice', 'setup', 'vs_setup_bootstrapper' -ErrorAction SilentlyContinue
              if (-not $running) { break }
              Start-Sleep -Seconds 10
          }
          $stopwatch.Stop()
          "Elapsed including wait: {0:F1} minutes" -f $stopwatch.Elapsed.TotalMinutes

      - name: Check ATL after attempt A
        id: check_a
        run: |
          $toolset = Get-ChildItem (Join-Path $env:VSPATH 'VC\Tools\MSVC') -Directory -Filter '14.29.*' | Select-Object -First 1
          $ok = $false
          if ($toolset) {
              $ok = (Test-Path (Join-Path $toolset.FullName 'atlmfc\include\atlbase.h')) -and (Test-Path (Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib'))
          }
          "v142 ATL installed after attempt A: $ok"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "installed=$ok"

      - name: Attempt B - Visual Studio bootstrapper from aka.ms
        if: steps.check_a.outputs.installed != 'True'
        continue-on-error: true
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $url = switch -Wildcard ($env:VSPRODUCT) {
              '*Enterprise'   { 'https://aka.ms/vs/17/release/vs_enterprise.exe'; break }
              '*Professional' { 'https://aka.ms/vs/17/release/vs_professional.exe'; break }
              default         { 'https://aka.ms/vs/17/release/vs_community.exe' }
          }
          $exe = Join-Path $env:RUNNER_TEMP 'vs_bootstrapper.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe

          $bootstrapperArgs = @(
              'modify',
              '--installPath', $env:VSPATH,
              '--productId', $env:VSPRODUCT,
              '--channelId', $env:CHANNEL_ID,
              '--add', $env:ATL_COMPONENT,
              '--quiet', '--norestart', '--wait', '--installWhileDownloading'
          )
          "Running: vs_bootstrapper.exe $($bootstrapperArgs -join ' ')"
          & $exe @bootstrapperArgs
          $stopwatch.Stop()
          "bootstrapper exit code: $LASTEXITCODE  (0=ok, 3010=ok+reboot pending, 1602=cancelled)"
          "Elapsed: {0:F1} minutes" -f $stopwatch.Elapsed.TotalMinutes

      - name: Final ATL state and compile
        continue-on-error: true
        run: |
          foreach ($toolset in (Get-ChildItem (Join-Path $env:VSPATH 'VC\Tools\MSVC') -Directory | Sort-Object Name)) {
              $hasHeader = Test-Path (Join-Path $toolset.FullName 'atlmfc\include\atlbase.h')
              $hasLib = Test-Path (Join-Path $toolset.FullName 'atlmfc\lib\x64\atls.lib')
              "{0,-16}  atlbase.h={1,-5}  x64\atls.lib={2}" -f $toolset.Name, $hasHeader, $hasLib
          }

          # Mirrors how hMailServer uses ATL: static ATL, COM smart pointers, MBCS.
          $probeDir = Join-Path $env:RUNNER_TEMP 'atlprobe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $source = @(
              '#include <atlbase.h>',
              '#include <atlcom.h>',
              '',
              'int main()',
              '{',
              '    ::CoInitialize(nullptr);',
              '    CComPtr<IUnknown> unknown;',
              '    CComBSTR text(L"probe");',
              '    ::CoUninitialize();',
              '    return unknown ? 1 : 0;',
              '}'
          )
          Set-Content -Path (Join-Path $probeDir 'probe.cpp') -Value $source -Encoding ascii

          $vcvars = Join-Path $env:VSPATH 'VC\Auxiliary\Build\vcvars64.bat'
          Push-Location $probeDir
          cmd /v:on /c "call `"$vcvars`" -vcvars_ver=14.29 && echo VCToolsVersion=!VCToolsVersion! && cl /nologo /EHsc /MD /D_MBCS probe.cpp atls.lib ole32.lib oleaut32.lib"
          $code = $LASTEXITCODE
          Pop-Location

          ""
          if ($code -eq 0) { "RESULT: static ATL compiles and links with the v142 toolset." }
          else { "RESULT: FAILED with exit code $code." }
          exit $code

      - name: Visual Studio setup logs
        if: always()
        continue-on-error: true
        run: |
          # The installer writes dd_*.log to %TEMP%; that is where the reason behind an exit
          # code lives (it is what identified the truncated install path).
          $logs = Get-ChildItem -Path $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 4
          if (-not $logs) { "No dd_*.log files found in $env:TEMP"; return }

          foreach ($log in $logs) {
              ""
              "================ $($log.Name)  ({0:N0} KB) ================" -f ($log.Length / 1KB)
              # Only the lines that carry a verdict: warnings, errors and exit codes.
              Get-Content $log.FullName |
                  Select-String -Pattern 'Warning:|Error|Exit Code|exit code|cannot be found|Package .* installed|Applying package' |
                  Select-Object -Last 40 |
                  ForEach-Object { $_.Line }
          }
